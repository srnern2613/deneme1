name: ignis
description: "Ignis — okuduğun kitaplardan kelime avla, zindanda pratik yap. Draconic Lingua markası."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  sqflite: ^2.4.3
  path: ^1.9.1
  sqflite_common_ffi: ^2.4.2+1
  file_selector: ^1.1.0
  file_selector_android: ^0.5.2+9
  shared_preferences: ^2.5.5
  syncfusion_flutter_pdf: ^34.2.5
  http: ^1.6.0
  flutter_tts: ^4.2.5
  audioplayers: ^6.8.1
  audio_service: ^0.18.19
  google_fonts: ^8.2.1
  phosphoricons_flutter: ^1.0.0
  flutter_animate: ^4.5.2
  rive: ^0.13.1

  # Ejderha Rotası V2 — Faz 2: Entitlement/Paywall (RevenueCat)
  purchases_flutter: ^10.12.0
  purchases_ui_flutter: ^10.12.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_icon.png"

flutter_native_splash:
  color: "#0f172a"
  image: assets/images/ignis_splash.png
  android_12:
    image: assets/images/ignis_splash.png
    icon_background_color: "#0f172a"
  fullscreen: true

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/books/
    - assets/rive/