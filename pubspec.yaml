name: ignis
description: "Ignis — okuduğun kitaplardan kelime avla, zindanda pratik yap. Draconic Lingua markası."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  sqflite: ^2.4.3
  path: ^1.9.1
  sqflite_common_ffi: ^2.4.2+1
  file_selector: ^1.1.0
  file_selector_android: ^0.5.2+9
  shared_preferences: ^2.5.5
  syncfusion_flutter_pdf: ^34.2.5
  http: ^1.6.0
  flutter_tts: ^4.2.5
  audioplayers: ^6.8.1
  audio_service: ^0.18.19
  google_fonts: ^8.2.1
  phosphoricons_flutter: ^1.0.0
  flutter_animate: ^4.5.2
  rive: ^0.13.1

  # Ejderha Rotası V2 — Faz 2: Entitlement/Paywall (RevenueCat)
  purchases_flutter: ^10.12.0
  purchases_ui_flutter: ^10.12.0

  # Hesap Sistemi — Firebase Authentication (e-posta/şifre girişi). Bu
  # çalışması için `android/app/google-services.json` dosyasının Firebase
  # Console'dan indirilip projeye eklenmesi ZORUNLU — o dosya olmadan build
  # başarısız olur (bkz. docs).
  firebase_core: ^3.8.0
  firebase_auth: ^5.3.3

  # Ayarlar → Bildirimler: "Günlük Hatırlatma" ve "Seri Kaybı Uyarısı"
  # anahtarlarının GERÇEK bildirim göndermesi için. `timezone` paketi,
  # zamanlanan bildirimin cihaz saat dilimine göre doğru saatte
  # tetiklenmesi için `flutter_local_notifications`'ın kendisi tarafından
  # gerekli kılınıyor.
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4
  # Cihazın gerçek saat dilimini (ör. "Europe/Istanbul") okumak için —
  # bu olmadan `timezone` paketi varsayılan olarak UTC kullanır ve
  # zamanlanan bildirim, kullanıcının seçtiği saatten farklı bir saatte
  # tetiklenir.
  flutter_timezone: ^3.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_icon.png"
  # Android 8+ (Oreo) adaptive ikon: bunlar verilmezse Android, kare görseli
  # "legacy" ikon sayıp KENDİSİ otomatik olarak beyaz zeminli bir daireye
  # küçültüp oturtuyor (ekrandaki "beyaz zeminde küçülmüş kare" görünümünün
  # sebebi buydu). Arka planı marka rengiyle, ön planı aynı görselle
  # tanımlayınca Android kendi otomatik küçültme/beyazlatma davranışını
  # uygulamıyor.
  adaptive_icon_background: "#0f172a"
  adaptive_icon_foreground: "assets/images/app_icon.png"

flutter_native_splash:
  # NOT (kutu/dikdörtgen görünme sorunu düzeltmesi): Bu #0f172a düz renk,
  # ignis_splash.png'nin gerçek kenar/köşe piksel tonundan (yaklaşık
  # #06070f, neredeyse siyah) belirgin biçimde daha açık/mavimsiydi — bu da
  # ekranda görselin kenarlarında görünür bir "kutu" kenarı/dikişi
  # oluşturuyordu. Artık görselin gerçek kenar tonuyla piksel seviyesinde
  # eşleşecek şekilde ayarlandı.
  color: "#06070f"
  image: assets/images/ignis_splash.png
  android_12:
    # ÖNEMLİ SINIRLAMA: Android 12+ kendi native splash API'sini dayatıyor —
    # bu API'de tam ekran özel görsel YOK, sadece ortada sabit boyutlu
    # (~240dp), dairesel maskelenen küçük bir "ikon" gösterilebiliyor. Tam
    # afiş görseli (ejderha + "IGNIS DRACONIC LINGUA" yazısı) o daireye
    # sığdırılmaya çalışılınca kenarlardan/yazıdan kırpılıyordu — gördüğün
    # o yuvarlak kırpılmış görüntünün sebebi bu. Bunun için afiş yerine,
    # zaten dairesel çerçeveye uygun tasarlanmış app_icon.png kullanılıyor.
    image: assets/images/app_icon.png
    # NOT: app_icon.png'nin gerçek kenar tonu (~#030c1e, neredeyse siyah)
    # eski #0f172a'dan belirgin biçimde koyu/farklıydı — Android 12+
    # cihazlarda (artık cihazların çoğu) ortada görünen "kutu" şikayetinin
    # asıl kaynağı büyük olasılıkla buydu. Artık ikonun gerçek kenar
    # tonuyla eşleşiyor.
    icon_background_color: "#030c1e"
  fullscreen: true

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/books/
    - assets/rive/